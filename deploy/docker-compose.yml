# BookSync self-hosting bundle: the sync server behind Caddy (automatic HTTPS).
#   cp deploy/.env.example deploy/.env   # then set BOOKSYNC_DOMAIN
#   docker compose -f deploy/docker-compose.yml up -d --build
name: booksync

services:
  booksync:
    image: ${BOOKSYNC_IMAGE:-booksync-server:local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Caddy is the only way in, and it appends the client address.
      BOOKSYNC_TRUST_PROXY_HEADERS: "true"
    # Not published on the host: all traffic must come through Caddy.
    expose:
      - "8080"
    volumes:
      - booksync-data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      booksync:
        condition: service_healthy
    environment:
      BOOKSYNC_DOMAIN: ${BOOKSYNC_DOMAIN:?set BOOKSYNC_DOMAIN in deploy/.env}
    ports:
      - "${BOOKSYNC_HTTP_PORT:-80}:80"
      - "${BOOKSYNC_HTTPS_PORT:-443}:443"
      - "${BOOKSYNC_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  booksync-data:
  caddy-data:
  caddy-config:
