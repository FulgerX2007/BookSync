name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs this as its gate.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal mobile)" || { gofmt -l cmd internal mobile; exit 1; }
      - name: go vet
        run: go vet ./... && (cd mobile && go vet ./...)
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
      - name: golangci-lint (mobile facade)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: mobile
      - name: Tests
        run: go test -race ./...
      # mobile/ is a nested module (the gomobile facade); ./... above skips it.
      - name: Tests (mobile facade)
        working-directory: mobile
        run: go test -race ./...

  extension:
    name: Extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: web-ext lint (Firefox)
        run: npx web-ext lint -s dist/firefox --self-hosted=false

  e2e:
    name: End-to-end (Chromium + Go server)
    needs: [go, extension]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      # Full Chromium only: the headless shell cannot load extensions.
      - run: npx playwright install --with-deps --no-shell chromium
      - run: npm run e2e
        env:
          CI: 'true'
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            extension/playwright-report
            extension/test-results
          retention-days: 7

  docker-smoke:
    name: Docker compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: deploy/smoke.sh
