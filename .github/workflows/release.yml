name: Release

# Pushing a tag vX.Y.Z (or vX.Y.Z-rc.1, published as a pre-release) builds
# everything, runs the full CI as a gate, then publishes:
#   * a GitHub Release with server archives for every OS/arch, both extension
#     zips, a source archive and SHA256SUMS (`make dist`);
#   * the server image ghcr.io/<owner>/booksync-server for linux/amd64 and arm64;
#   * the Android APK and AAB, signed with the ANDROID_KEYSTORE_* secrets
#     (skipped, with a warning, when they are not configured: an unsigned APK
#     cannot be installed);
#   * for final versions, after a person approves the `stores` environment:
#     the store submissions (Firefox Add-ons, Chrome Web Store, Edge Add-ons,
#     Google Play internal track), each one only when its keys are configured
#     (docs/store-publishing.md).
# The tag is the version: the server gets X.Y.Z[-suffix], the extension X.Y.Z
# (stores need plain numbers). Creating a release in the GitHub UI pushes its
# tag too; the workflow then attaches the artifacts to that release.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Read version from tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        run: |
          tag="$GITHUB_REF_NAME"
          if ! [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag $tag is not vX.Y.Z or vX.Y.Z-suffix"
            exit 1
          fi
          suffix="${BASH_REMATCH[2]}"
          echo "version=${tag#v}" >>"$GITHUB_OUTPUT"
          echo "prerelease=$([[ -n "$suffix" ]] && echo true || echo false)" >>"$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: version
    uses: ./.github/workflows/ci.yml

  dist:
    name: Build artifacts
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: extension
      - run: make dist VERSION="${{ needs.version.outputs.version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  android-apk:
    name: Android APK and AAB
    needs: version
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 29.0.14206865
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Signing configured?
        if: env.HAS_KEYSTORE != 'true'
        run: echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; this release has no Android APK or AAB."
      - uses: actions/checkout@v7
        if: env.HAS_KEYSTORE == 'true'
      - uses: actions/setup-go@v7
        if: env.HAS_KEYSTORE == 'true'
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            mobile/go.sum
      - uses: actions/setup-java@v6
        if: env.HAS_KEYSTORE == 'true'
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            android/gradle/libs.versions.toml
            android/gradle/wrapper/gradle-wrapper.properties
            android/**/*.gradle.kts
      - uses: android-actions/setup-android@v4
        if: env.HAS_KEYSTORE == 'true'
      - name: SDK packages
        if: env.HAS_KEYSTORE == 'true'
        run: |
          for i in 1 2 3; do
            sdkmanager --install "platforms;android-37.0" "ndk;$NDK_VERSION" && break
            sleep $((i * 10))
          done
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >>"$GITHUB_ENV"
      - name: Build and sign
        if: env.HAS_KEYSTORE == 'true'
        env:
          BOOKSYNC_VERSION: ${{ needs.version.outputs.version }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          base64 -d <<<"$KEYSTORE_BASE64" >"$ANDROID_KEYSTORE_FILE"
          make android-apk android-aab
          mkdir -p apk
          cp android/app/build/outputs/apk/release/app-release.apk "apk/booksync-android-$BOOKSYNC_VERSION.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "apk/booksync-android-$BOOKSYNC_VERSION.aab"
      - uses: actions/upload-artifact@v7
        if: env.HAS_KEYSTORE == 'true'
        with:
          name: android
          path: apk/
          if-no-files-found: error

  image:
    name: Server image
    needs: [version, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      name: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v7
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/booksync-server" >>"$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          # X.Y.Z, plus X.Y and latest for non-pre-releases.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ needs.version.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub Release
    needs: [version, ci, dist, image, android-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # dist, plus the APK and AAB when signing is configured.
      - uses: actions/download-artifact@v8
        with:
          pattern: '{dist,android}'
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && rm -f SHA256SUMS && sha256sum -- * >SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          IMAGE: ${{ needs.image.outputs.name }}
        run: |
          notes="$(cat <<EOF
          **Server image:** \`$IMAGE:$VERSION\` (linux/amd64, linux/arm64). Set \`BOOKSYNC_IMAGE\` in \`deploy/.env\` to use it with the compose bundle.

          **Extension:** \`booksync-chromium-${VERSION%%-*}.zip\` and \`booksync-firefox-${VERSION%%-*}.zip\` (stores need a plain X.Y.Z version); see "Installing the extension" in the README.

          **Android:** \`booksync-android-$VERSION.apk\` to install directly, and \`booksync-android-$VERSION.aab\` for Google Play, when attached; see "Android app" in the README.

          Verify downloads with \`sha256sum -c SHA256SUMS\`.
          EOF
          )"
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            # Made in the GitHub UI (or by an earlier run): keep its title and
            # notes, (re)attach the artifacts, and add our notes if it has none.
            gh release upload "$tag" dist/* --clobber
            if [[ -z "$(gh release view "$tag" --json body --jq .body)" ]]; then
              gh release edit "$tag" --notes "$notes"
            fi
          else
            flags=(--verify-tag --title "BookSync $VERSION" --generate-notes --notes "$notes")
            [[ "$PRERELEASE" == true ]] && flags+=(--prerelease)
            gh release create "$tag" dist/* "${flags[@]}"
          fi

  stores:
    name: Store submissions
    needs: [version, release]
    if: needs.version.outputs.prerelease != 'true'
    runs-on: ubuntu-latest
    # Waits for a reviewer of the `stores` environment to approve; its secrets
    # and variables configure the stores (docs/store-publishing.md).
    environment: stores
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
      DIST: dist
      HAS_FIREFOX: ${{ secrets.AMO_API_KEY != '' && secrets.AMO_API_SECRET != '' }}
      HAS_CHROME: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON != '' && vars.CWS_PUBLISHER_ID != '' && vars.CWS_EXTENSION_ID != '' }}
      HAS_EDGE: ${{ secrets.EDGE_API_KEY != '' && vars.EDGE_CLIENT_ID != '' && vars.EDGE_PRODUCT_ID != '' }}
      HAS_PLAY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON != '' && vars.PLAY_PACKAGE_NAME != '' }}
      STORE_REVIEWER_NOTES: ${{ secrets.STORE_REVIEWER_NOTES }}
    steps:
      - name: Configured stores
        run: |
          for s in FIREFOX CHROME EDGE PLAY; do
            v="HAS_$s"
            [[ "${!v}" == true ]] || echo "::warning::$s is not configured; skipped (docs/store-publishing.md)."
          done
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        if: env.HAS_FIREFOX == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Install web-ext
        if: env.HAS_FIREFOX == 'true'
        run: npm ci --no-audit --no-fund
        working-directory: extension
      # The files the GitHub Release just published.
      - uses: actions/download-artifact@v8
        with:
          pattern: '{dist,android}'
          path: dist
          merge-multiple: true
      # Each store runs even when an earlier one failed; any failure fails the job.
      - name: Firefox Add-ons
        if: ${{ !cancelled() && env.HAS_FIREFOX == 'true' }}
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: scripts/publish-stores.sh firefox
      - name: Chrome Web Store
        if: ${{ !cancelled() && env.HAS_CHROME == 'true' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
        run: scripts/publish-stores.sh chrome
      - name: Edge Add-ons
        if: ${{ !cancelled() && env.HAS_EDGE == 'true' }}
        env:
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_CLIENT_ID: ${{ vars.EDGE_CLIENT_ID }}
          EDGE_PRODUCT_ID: ${{ vars.EDGE_PRODUCT_ID }}
        run: scripts/publish-stores.sh edge
      - name: Google Play (internal track)
        if: ${{ !cancelled() && env.HAS_PLAY == 'true' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          PLAY_PACKAGE_NAME: ${{ vars.PLAY_PACKAGE_NAME }}
          PLAY_TRACK: internal
          PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
        run: |
          if [[ ! -f "dist/booksync-android-$VERSION.aab" ]]; then
            echo "::warning::No AAB in this release (Android signing is not configured); Google Play skipped."
            exit 0
          fi
          scripts/publish-stores.sh play
